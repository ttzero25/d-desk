<title>Test Checking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --bg: #f2f4f7;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --line: #e4e8ee;
    --line-strong: #d3d9e2;
    --ink: #14171d;
    --ink-2: #434a55;
    --muted: #79828f;
    --accent: #4f46e5;
    --accent-soft: #eef0fe;
    --accent-ink: #3730a3;
    --urgent: #dc2626;
    --urgent-soft: #fdecec;
    --soon: #c2700a;
    --soon-soft: #fdf1e1;
    --safe: #0f8a5f;
    --safe-soft: #e6f6ef;
    --shadow-sm: 0 1px 2px rgba(20,23,29,.06);
    --shadow-md: 0 6px 24px -12px rgba(20,23,29,.28);
    --radius: 14px;
    --radius-sm: 9px;
    --sans: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101318;
      --surface: #191d24;
      --surface-2: #1f242c;
      --line: #2a303a;
      --line-strong: #363d49;
      --ink: #e9edf3;
      --ink-2: #b3bcc9;
      --muted: #7d8794;
      --accent: #8b83ff;
      --accent-soft: #241f3f;
      --accent-ink: #b9b3ff;
      --urgent: #ff6b6b;
      --urgent-soft: #34181a;
      --soon: #eaa64d;
      --soon-soft: #33260f;
      --safe: #4cc38a;
      --safe-soft: #12291f;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
      --shadow-md: 0 8px 30px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101318;
    --surface: #191d24;
    --surface-2: #1f242c;
    --line: #2a303a;
    --line-strong: #363d49;
    --ink: #e9edf3;
    --ink-2: #b3bcc9;
    --muted: #7d8794;
    --accent: #8b83ff;
    --accent-soft: #241f3f;
    --accent-ink: #b9b3ff;
    --urgent: #ff6b6b;
    --urgent-soft: #34181a;
    --soon: #eaa64d;
    --soon-soft: #33260f;
    --safe: #4cc38a;
    --safe-soft: #12291f;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow-md: 0 8px 30px -14px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 400;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }
  a { color: inherit; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 22px 20px 80px; }

  /* ---------- Header ---------- */
  .top {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
  }
  .brand { display: flex; flex-direction: column; gap: 3px; }
  .brand .kicker {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase; color: var(--accent);
  }
  .brand h1 { font-size: clamp(23px, 4vw, 30px); }
  .brand .today { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-top: 2px; }
  .top-actions { display: flex; gap: 8px; align-items: center; }

  /* ---------- Buttons ---------- */
  .btn {
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
    border-radius: var(--radius-sm); padding: 8px 13px; font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px; transition: .12s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.07); color: #fff; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 6px 8px; }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn.icon { padding: 7px; }
  .btn svg { width: 15px; height: 15px; }

  /* ---------- Stat tiles ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 15px 16px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
  }
  .stat .lbl { font-size: 12px; color: var(--muted); font-weight: 500; }
  .stat .val { font-family: var(--mono); font-size: 30px; font-weight: 600; line-height: 1.1; margin-top: 6px; letter-spacing: -.02em; }
  .stat .sub { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
  .stat.hero { color: #fff; border: none; background: linear-gradient(135deg, var(--accent), #6d63ff); }
  .stat.hero .lbl, .stat.hero .sub { color: rgba(255,255,255,.82); }

  /* ---------- Layout ---------- */
  .grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 20px; }
  section.panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  .panel-head h2 { font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .panel-head .count { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .panel-body { padding: 14px 16px; }

  /* ---------- Today card ---------- */
  .today-card .panel-head { background: var(--accent-soft); border-bottom-color: transparent; }
  .today-card .panel-head h2 { color: var(--accent-ink); }
  .today-block { margin-bottom: 16px; }
  .today-block:last-child { margin-bottom: 0; }
  .today-block .sec-label {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    font-weight: 600; margin-bottom: 9px;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .study-chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px 8px 10px;
    border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface-2);
    font-size: 13px; font-weight: 500;
  }
  .study-chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .study-chip .dd { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .study-chip.done { opacity: .5; text-decoration: line-through; }
  .study-chip button { border: none; background: none; padding: 0; color: var(--muted); display: inline-flex; }
  .study-chip button:hover { color: var(--accent); }
  .empty-line { color: var(--muted); font-size: 13px; padding: 4px 0; }

  /* ---------- Timeline ---------- */
  .day {
    display: grid; grid-template-columns: 88px 1fr; gap: 14px; padding: 13px 0;
    border-top: 1px solid var(--line);
  }
  .day:first-child { border-top: none; }
  .day.is-today .date .d { color: var(--accent); }
  .day .date { display: flex; flex-direction: column; gap: 1px; }
  .day .date .d { font-family: var(--mono); font-size: 15px; font-weight: 600; }
  .day .date .wd { font-size: 12px; color: var(--muted); }
  .day .date .rel { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
  .day .items { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .titem { display: flex; align-items: center; gap: 9px; font-size: 13.5px; }
  .titem .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .titem .exam-badge, .titem .due-badge {
    font-family: var(--mono); font-size: 10px; font-weight: 600; padding: 2px 6px;
    border-radius: 5px; letter-spacing: .03em; flex: none;
  }
  .titem .exam-badge { background: var(--urgent-soft); color: var(--urgent); }
  .titem .due-badge { background: var(--soon-soft); color: var(--soon); }
  .titem.done span.tx { text-decoration: line-through; color: var(--muted); }
  .titem .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Subject cards ---------- */
  .subj-list { display: flex; flex-direction: column; gap: 11px; }
  .subj {
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 13px 14px;
    background: var(--surface); position: relative;
  }
  .subj::before {
    content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px;
    border-radius: 3px; background: var(--sc, var(--accent));
  }
  .subj-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding-left: 10px; }
  .subj-name { font-size: 15px; font-weight: 600; }
  .subj-meta { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 2px; }
  .dday {
    font-family: var(--mono); font-weight: 600; font-size: 13px; padding: 3px 9px;
    border-radius: 7px; white-space: nowrap; flex: none;
  }
  .dday.urgent { background: var(--urgent-soft); color: var(--urgent); }
  .dday.soon { background: var(--soon-soft); color: var(--soon); }
  .dday.safe { background: var(--safe-soft); color: var(--safe); }
  .dday.past { background: var(--surface-2); color: var(--muted); }
  .progress { padding-left: 10px; margin-top: 11px; }
  .progress .bar { height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .progress .bar > i { display: block; height: 100%; border-radius: 4px; background: var(--sc, var(--accent)); transition: width .3s; }
  .progress .ptxt { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 5px; font-family: var(--mono); }
  .mats { padding-left: 10px; margin-top: 11px; display: flex; flex-wrap: wrap; gap: 6px; }
  .mat {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; text-decoration: none;
    padding: 4px 9px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line);
    color: var(--ink-2); max-width: 100%;
  }
  .mat:hover { border-color: var(--accent); color: var(--accent); }
  .mat span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mat svg { width: 12px; height: 12px; flex: none; opacity: .7; }
  .subj-actions { padding-left: 10px; margin-top: 11px; display: flex; gap: 6px; }
  .subj-actions .btn { padding: 5px 10px; font-size: 12px; }

  /* ---------- Assignments ---------- */
  .asn-list { display: flex; flex-direction: column; }
  .asn {
    display: flex; align-items: center; gap: 11px; padding: 11px 2px;
    border-top: 1px solid var(--line);
  }
  .asn:first-child { border-top: none; }
  .check {
    width: 20px; height: 20px; border-radius: 6px; border: 1.6px solid var(--line-strong);
    background: var(--surface); flex: none; display: grid; place-items: center; transition: .12s;
  }
  .check:hover { border-color: var(--accent); }
  .check svg { width: 12px; height: 12px; opacity: 0; color: #fff; }
  .asn.done .check { background: var(--safe); border-color: var(--safe); }
  .asn.done .check svg { opacity: 1; }
  .asn .info { flex: 1; min-width: 0; }
  .asn .info .t { font-size: 14px; font-weight: 500; }
  .asn.done .info .t { text-decoration: line-through; color: var(--muted); }
  .asn .info .m { font-size: 12px; color: var(--muted); margin-top: 1px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .asn .tag { display: inline-flex; align-items: center; gap: 5px; }
  .asn .tag .dot { width: 7px; height: 7px; border-radius: 50%; }
  .asn .dm { font-family: var(--mono); }
  .asn .dm.over { color: var(--urgent); font-weight: 600; }
  .asn .dm.soon { color: var(--soon); font-weight: 600; }
  .asn .del { border: none; background: none; color: var(--muted); padding: 4px; display: inline-flex; opacity: 0; transition: .12s; }
  .asn:hover .del { opacity: 1; }
  .asn .del:hover { color: var(--urgent); }

  /* ---------- Empty / demo ---------- */
  .demo-banner {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 18px;
    background: var(--accent-soft); border: 1px dashed var(--accent); border-radius: var(--radius-sm);
    color: var(--accent-ink); font-size: 13px;
  }
  .demo-banner b { font-weight: 600; }
  .demo-banner svg { width: 16px; height: 16px; flex: none; }
  .is-demo { opacity: .82; }
  .panel-empty { color: var(--muted); font-size: 13.5px; text-align: center; padding: 22px 10px; }

  /* ---------- Modal ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(15,18,24,.5); backdrop-filter: blur(2px);
    display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50;
    overflow-y: auto;
  }
  .scrim.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 460px;
    box-shadow: var(--shadow-md); border: 1px solid var(--line); animation: pop .16s ease;
  }
  @keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .modal { animation: none; } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .modal-head h3 { font-size: 16px; }
  .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
  .field input, .field select {
    border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink);
    border-radius: 8px; padding: 9px 11px; font-size: 14px; width: 100%;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mat-edit { display: flex; gap: 8px; align-items: center; }
  .mat-edit input { flex: 1; }
  .mat-edit .rm { border: none; background: none; color: var(--muted); padding: 6px; display: inline-flex; }
  .mat-edit .rm:hover { color: var(--urgent); }
  .add-mat { font-size: 12.5px; color: var(--accent); background: none; border: none; padding: 2px 0; display: inline-flex; align-items: center; gap: 5px; align-self: flex-start; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 860px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) {
    .wrap { padding: 16px 13px 70px; }
    .day { grid-template-columns: 72px 1fr; }
  }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="kicker">시험 학습 플래너</span>
      <h1>Test Checking</h1>
      <span class="today" id="todayLabel"></span>
    </div>
    <div class="top-actions">
      <button class="btn icon ghost" id="themeBtn" title="테마 전환" aria-label="테마 전환">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="btn" data-action="add-assignment">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        과제 추가
      </button>
      <button class="btn primary" data-action="add-subject">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        과목 추가
      </button>
    </div>
  </header>

  <div id="demoBanner"></div>
  <div class="stats" id="stats"></div>

  <div class="grid">
    <div class="col">
      <section class="panel today-card">
        <div class="panel-head"><h2>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          오늘 할 일</h2></div>
        <div class="panel-body" id="today"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>학습 일정</h2>
          <span class="count" id="agendaCount"></span>
        </div>
        <div class="panel-body" id="agenda"></div>
      </section>
    </div>

    <div class="col">
      <section class="panel">
        <div class="panel-head">
          <h2>과목</h2>
          <span class="count" id="subjCount"></span>
        </div>
        <div class="panel-body"><div class="subj-list" id="subjects"></div></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>과제</h2>
          <span class="count" id="asnCount"></span>
        </div>
        <div class="panel-body"><div class="asn-list" id="assignments"></div></div>
      </section>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>

<script>
"use strict";
(function () {
  /* ============ 상수 ============ */
  var PALETTE = ["#4f46e5","#0ea5e9","#0f8a5f","#c2700a","#db2777","#7c3aed","#0891b2","#b45309"];
  var WORKLOAD = { 1: {label:"가볍게", factor:0.4}, 2: {label:"보통", factor:0.6}, 3: {label:"빡세게", factor:0.9} };
  var DAY = 86400000;
  var WD = ["일","월","화","수","목","금","토"];

  /* ============ 날짜 유틸 (로컬 기준, 타임존 표류 없음) ============ */
  function pad(n){ return (n<10?"0":"")+n; }
  function keyOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayKey(){ return keyOf(new Date()); }
  function parseKey(k){ var p=k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function diffDays(fromKey, toKey){ return Math.round((parseKey(toKey)-parseKey(fromKey))/DAY); }
  function fmtDate(k){ var d=parseKey(k); return (d.getMonth()+1)+"월 "+d.getDate()+"일"; }
  function ddayLabel(n){ return n===0 ? "D-DAY" : n>0 ? "D-"+n : "D+"+Math.abs(n); }
  function ddayClass(n){ return n<0?"past":n<=2?"urgent":n<=5?"soon":"safe"; }

  /* ============ 저장소: db 우선, 없으면 localStorage 폴백 ============ */
  function makeId(){ return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  function DbStore(db){
    this.db = db;
    this.subjects = {}; this.assignments = {};
  }
  DbStore.prototype.start = function(onChange){
    var self=this;
    this.db.collection("subjects").onSnapshot(function(s){
      self.subjects={}; s.docs.forEach(function(d){ self.subjects[d.id]=Object.assign({id:d.id}, d.data()); }); onChange();
    }, function(){});
    this.db.collection("assignments").onSnapshot(function(s){
      self.assignments={}; s.docs.forEach(function(d){ self.assignments[d.id]=Object.assign({id:d.id}, d.data()); }); onChange();
    }, function(){});
  };
  DbStore.prototype.saveSubject = function(o){ var id=o.id||makeId(); var b=Object.assign({},o); delete b.id; return this.db.doc("subjects/"+id).set(b); };
  DbStore.prototype.deleteSubject = function(id){ return this.db.doc("subjects/"+id).delete(); };
  DbStore.prototype.saveAssignment = function(o){ var id=o.id||makeId(); var b=Object.assign({},o); delete b.id; return this.db.doc("assignments/"+id).set(b); };
  DbStore.prototype.deleteAssignment = function(id){ return this.db.doc("assignments/"+id).delete(); };
  DbStore.prototype.getSubjects = function(){ return this.subjects; };
  DbStore.prototype.getAssignments = function(){ return this.assignments; };

  function LocalStore(){ this.KEY="exam_dashboard_v1"; this.data={subjects:{},assignments:{}}; this._read(); }
  LocalStore.prototype._read = function(){ try{ var r=localStorage.getItem(this.KEY); if(r) this.data=JSON.parse(r); }catch(e){} };
  LocalStore.prototype._write = function(){ try{ localStorage.setItem(this.KEY, JSON.stringify(this.data)); }catch(e){} };
  LocalStore.prototype.start = function(onChange){
    var self=this; this._cb=onChange;
    window.addEventListener("storage", function(e){ if(e.key===self.KEY){ self._read(); onChange(); } });
    onChange();
  };
  LocalStore.prototype.saveSubject = function(o){ var id=o.id||makeId(); this.data.subjects[id]=Object.assign({},o,{id:id}); this._write(); this._cb(); return Promise.resolve(); };
  LocalStore.prototype.deleteSubject = function(id){ delete this.data.subjects[id]; this._write(); this._cb(); return Promise.resolve(); };
  LocalStore.prototype.saveAssignment = function(o){ var id=o.id||makeId(); this.data.assignments[id]=Object.assign({},o,{id:id}); this._write(); this._cb(); return Promise.resolve(); };
  LocalStore.prototype.deleteAssignment = function(id){ delete this.data.assignments[id]; this._write(); this._cb(); return Promise.resolve(); };
  LocalStore.prototype.getSubjects = function(){ return this.data.subjects; };
  LocalStore.prototype.getAssignments = function(){ return this.data.assignments; };

  var store = null;
  var isDemo = false;

  /* ============ 데모(예시) 데이터 — 저장 안 됨, 첫 화면 미리보기용 ============ */
  function demoData(){
    var t = new Date();
    function plus(n){ var d=new Date(t.getTime()+n*DAY); return keyOf(d); }
    var subjects = {
      d1: { id:"d1", name:"자료구조", exam:plus(3), workload:3, colorIdx:0,
            materials:[{label:"강의노트 PDF",url:"#"},{label:"기출문제",url:"#"}], done:{} },
      d2: { id:"d2", name:"미시경제학", exam:plus(6), workload:2, colorIdx:1,

  /* ============ 데이터 접근 (데모/실데이터 통합) ============ */
  var _demo = null;
  function subjects(){ return isDemo ? _demo.subjects : store.getSubjects(); }
  function assignments(){ return isDemo ? _demo.assignments : store.getAssignments(); }
  function subjColor(s){ return PALETTE[(s.colorIdx||0) % PALETTE.length]; }

  /* ============ 스케줄링: 시험일 역산 분산 학습 ============ */
  // 각 과목에 대해 오늘~시험 전날 사이 학습일에 세션을 고르게 분산.
  // 세션 수 = clamp(round(남은일수 * 난이도계수), 2, 학습가능일수). 마지막 세션은 시험 전날(최종복습).
  function scheduleForSubject(s, tKey){
    var toExam = diffDays(tKey, s.exam);           // 오늘부터 시험까지 남은 일수
    if (toExam < 0) return [];                      // 이미 지난 시험
    var studyDays = Math.max(1, toExam);            // 시험 당일 제외한 학습 가능 일수 (최소 1)
    var factor = (WORKLOAD[s.workload]||WORKLOAD[2]).factor;
    var count = Math.round(toExam * factor);
    count = Math.max(2, Math.min(count, studyDays));
    if (toExam <= 1) count = 1;                      // 시험이 오늘/내일이면 딱 한 번(벼락치기 복습)
    var idxs = [];
    if (count === 1) { idxs = [studyDays - 1]; }
    else {
      for (var k=0; k<count; k++){
        idxs.push(Math.round(k * (studyDays - 1) / (count - 1)));
      }
    }
    // 중복 제거
    var seen={}, out=[];
    idxs.forEach(function(i){ if(!seen[i]){ seen[i]=1; out.push(i); } });
    return out.map(function(i){ return keyOf(new Date(parseKey(tKey).getTime() + i*DAY)); });
  }

  // 전체 일정을 dateKey -> {study:[subj], exams:[subj], dues:[asn]} 로 구성
  function buildAgenda(tKey){
    var subs = subjects(), asns = assignments();
    var map = {}; // key -> obj
    function slot(k){ if(!map[k]) map[k]={key:k, study:[], exams:[], dues:[]}; return map[k]; }

    Object.keys(subs).forEach(function(id){
      var s = subs[id];
      var toExam = diffDays(tKey, s.exam);
      if (toExam >= 0) slot(s.exam).exams.push(s);
      scheduleForSubject(s, tKey).forEach(function(k){
        // 시험 당일에는 세션 표시 안 함(시험이므로)
        if (k !== s.exam || toExam === 0) slot(k).study.push(s);
      });
    });
    Object.keys(asns).forEach(function(id){
      var a = asns[id];
      if (a.due) slot(a.due).dues.push(a);
    });

    var keys = Object.keys(map).filter(function(k){ return diffDays(tKey,k) >= 0; }).sort();
    return { map: map, keys: keys };
  }

  /* ============ 렌더링 ============ */
  var $ = function(id){ return document.getElementById(id); };
  function el(html){ var t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12l5 5L20 6"/></svg>';
  var LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>';
  var X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';

  function render(){
    var tKey = todayKey();
    var d = new Date();
    $("todayLabel").textContent = d.getFullYear()+". "+pad(d.getMonth()+1)+". "+pad(d.getDate())+". ("+WD[d.getDay()]+")";

    var subs = subjects(), asns = assignments();
    var subIds = Object.keys(subs), asnIds = Object.keys(asns);

    // 데모 배너
    $("demoBanner").innerHTML = isDemo
      ? '<div class="demo-banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8h.01M11 12h1v4h1"/></svg><span><b>예시 화면입니다.</b> 과목을 추가하면 실제 데이터로 바뀌고, 여러 기기에서 동기화됩니다.</span></div>'
      : "";
    document.querySelector(".grid").classList.toggle("is-demo", isDemo);
    $("stats").classList.toggle("is-demo", isDemo);

    renderStats(tKey, subs, asns);
    renderToday(tKey, subs, asns);
    renderAgenda(tKey);
    renderSubjects(tKey, subs, subIds);
    renderAssignments(tKey, subs, asns, asnIds);
  }

  function renderStats(tKey, subs, asns){
    var upcoming = Object.keys(subs).map(function(id){ return subs[id]; })
      .filter(function(s){ return diffDays(tKey, s.exam) >= 0; })
      .sort(function(a,b){ return a.exam < b.exam ? -1 : 1; });
    var nearest = upcoming[0];
    var openAsn = Object.keys(asns).map(function(id){return asns[id];}).filter(function(a){ return !a.done; });
    var soonAsn = openAsn.filter(function(a){ return a.due && diffDays(tKey,a.due) <= 3; });

    // 오늘 학습 세션 수
    var todayStudy = 0;
    Object.keys(subs).forEach(function(id){
      if (scheduleForSubject(subs[id], tKey).indexOf(tKey) >= 0 && subs[id].exam !== tKey) todayStudy++;
    });

    var heroVal = nearest ? ddayLabel(diffDays(tKey, nearest.exam)) : "—";
    var heroSub = nearest ? nearest.name + " · " + fmtDate(nearest.exam) : "예정된 시험 없음";

    $("stats").innerHTML =
      stat("hero", "다음 시험", heroVal, heroSub) +
      stat("", "남은 시험", upcoming.length, upcoming.length? "가장 먼 시험 "+ddayLabel(diffDays(tKey, upcoming[upcoming.length-1].exam)) : "모두 완료") +
      stat("", "오늘 공부할 과목", todayStudy, todayStudy? "역산 일정 기준" : "오늘은 휴식 가능") +
      stat("", "남은 과제", openAsn.length, soonAsn.length? soonAsn.length+"개 마감 임박" : "임박 과제 없음");
  }
  function stat(cls, lbl, val, sub){
    return '<div class="stat '+cls+'"><div class="lbl">'+esc(lbl)+'</div><div class="val">'+esc(val)+'</div><div class="sub">'+esc(sub)+'</div></div>';
  }

  function renderToday(tKey, subs, asns){
    var host = $("today");
    // 오늘 학습 세션
    var todaySubs = Object.keys(subs).map(function(id){return subs[id];})
      .filter(function(s){ return s.exam!==tKey && scheduleForSubject(s, tKey).indexOf(tKey) >= 0; })
      .sort(function(a,b){ return diffDays(tKey,a.exam)-diffDays(tKey,b.exam); });
    // 오늘이 시험인 과목
    var todayExams = Object.keys(subs).map(function(id){return subs[id];}).filter(function(s){ return s.exam===tKey; });
    // 마감 임박/지난 과제 (미완료, 3일 이내 또는 지남)
    var hotAsn = Object.keys(asns).map(function(id){return asns[id];})
      .filter(function(a){ return !a.done && a.due && diffDays(tKey,a.due) <= 3; })
      .sort(function(a,b){ return a.due<b.due?-1:1; });

    var html = "";
    if (todayExams.length){
      html += '<div class="today-block"><div class="sec-label" style="color:var(--urgent)">오늘 시험</div><div class="chip-row">';
      todayExams.forEach(function(s){
        html += '<span class="study-chip" style="border-color:var(--urgent)"><span class="dot" style="background:'+subjColor(s)+'"></span>'+esc(s.name)+' <span class="dd" style="color:var(--urgent)">D-DAY</span></span>';
      });
      html += '</div></div>';
    }

    html += '<div class="today-block"><div class="sec-label">공부할 과목</div>';
    if (todaySubs.length){
      html += '<div class="chip-row">';
      todaySubs.forEach(function(s){
        var done = s.done && s.done[tKey];
        html += '<span class="study-chip '+(done?"done":"")+'"><span class="dot" style="background:'+subjColor(s)+'"></span>'+esc(s.name)+
          ' <span class="dd">'+ddayLabel(diffDays(tKey,s.exam))+'</span>'+
          '<button data-action="toggle-study" data-id="'+s.id+'" title="완료 표시">'+(done?CHECK:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/></svg>')+'</button></span>';
      });
      html += '</div>';
    } else {
      html += '<div class="empty-line">오늘 배정된 학습 세션이 없어요. 필요하면 과목의 난이도를 올려보세요.</div>';
    }
    html += '</div>';

    html += '<div class="today-block"><div class="sec-label">마감 임박 과제</div>';
    if (hotAsn.length){
      html += '<div class="chip-row">';
      hotAsn.forEach(function(a){
        var n = diffDays(tKey,a.due);
        var col = n<0?"var(--urgent)":n<=1?"var(--soon)":"var(--muted)";
        html += '<span class="study-chip"><span class="dd" style="color:'+col+'">'+(n<0?"지남":ddayLabel(n))+'</span>'+esc(a.title)+'</span>';
      });
      html += '</div>';
    } else {
      html += '<div class="empty-line">임박한 과제가 없어요. 👍</div>';
    }
    html += '</div>';
    host.innerHTML = html;
  }

  function renderAgenda(tKey){
    var host = $("agenda");
    var ag = buildAgenda(tKey);
    // 오늘~마지막 항목까지 연속 날짜로 표시 (항목 없는 날은 생략하되 오늘은 항상 포함)
    var keys = ag.keys.slice(0, 40);
    if (keys.indexOf(tKey) < 0) keys.unshift(tKey);
    $("agendaCount").textContent = keys.length ? keys.length+"일" : "";
    if (!keys.length){ host.innerHTML = '<div class="panel-empty">과목이나 과제를 추가하면 일정이 여기에 나타납니다.</div>'; return; }

    var html = "";
    keys.forEach(function(k){
      var slot = ag.map[k] || {study:[],exams:[],dues:[]};
      var n = diffDays(tKey,k);
      var dt = parseKey(k);
      var rel = n===0?"오늘":n===1?"내일":ddayLabel(n);
      var items = "";
      slot.exams.forEach(function(s){
        items += '<div class="titem"><span class="dot" style="background:'+subjColor(s)+'"></span><span class="exam-badge">시험</span><span class="tx">'+esc(s.name)+'</span></div>';
      });
      slot.dues.forEach(function(a){
        var sc = a.subjectId && subjects()[a.subjectId] ? subjColor(subjects()[a.subjectId]) : "var(--muted)";
        items += '<div class="titem '+(a.done?"done":"")+'"><span class="dot" style="background:'+sc+'"></span><span class="due-badge">과제</span><span class="tx">'+esc(a.title)+'</span></div>';
      });
      slot.study.forEach(function(s){
        var done = s.done && s.done[k];
        items += '<div class="titem '+(done?"done":"")+'"><span class="dot" style="background:'+subjColor(s)+'"></span><span class="tx">'+esc(s.name)+' 공부</span></div>';
      });
      if (!items) items = '<div class="titem"><span class="tx" style="color:var(--muted)">여유 있는 날</span></div>';
      html += '<div class="day '+(n===0?"is-today":"")+'"><div class="date"><span class="d">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</span><span class="wd">'+WD[dt.getDay()]+'요일</span><span class="rel">'+rel+'</span></div><div class="items">'+items+'</div></div>';
    });
    host.innerHTML = html;
  }

  function renderSubjects(tKey, subs, ids){
    var host = $("subjects");
    $("subjCount").textContent = ids.length ? ids.length+"과목" : "";
    if (!ids.length){ host.innerHTML = '<div class="panel-empty">아직 과목이 없어요.<br>‘과목 추가’로 시험 과목을 등록해 보세요.</div>'; return; }
    var arr = ids.map(function(id){return subs[id];}).sort(function(a,b){
      var da=diffDays(tKey,a.exam), db_=diffDays(tKey,b.exam);
      if(da<0 && db_>=0) return 1; if(db_<0 && da>=0) return -1; return da-db_;
    });
    var html = "";
    arr.forEach(function(s){
      var n = diffDays(tKey, s.exam);
      var sched = scheduleForSubject(s, tKey);
      var doneCount = sched.filter(function(k){ return s.done && s.done[k]; }).length;
      var pct = sched.length ? Math.round(doneCount/sched.length*100) : (n<0?100:0);
      var col = subjColor(s);
      var mats = (s.materials||[]).filter(function(m){return m.label||m.url;}).map(function(m){
        var href = m.url && m.url!=="#" ? esc(m.url) : "#";
        return '<a class="mat" href="'+href+'" target="_blank" rel="noopener">'+LINK+'<span>'+esc(m.label||m.url)+'</span></a>';
      }).join("");
      html += '<div class="subj" style="--sc:'+col+'">'+
        '<div class="subj-top"><div><div class="subj-name">'+esc(s.name)+'</div>'+
          '<div class="subj-meta">'+fmtDate(s.exam)+' ('+WD[parseKey(s.exam).getDay()]+') · '+(WORKLOAD[s.workload]||WORKLOAD[2]).label+'</div></div>'+
          '<span class="dday '+ddayClass(n)+'">'+ddayLabel(n)+'</span></div>'+
        (n>=0 ? '<div class="progress"><div class="bar"><i style="width:'+pct+'%"></i></div><div class="ptxt"><span>학습 진도</span><span>'+doneCount+' / '+sched.length+' 세션</span></div></div>' : '')+
        (mats ? '<div class="mats">'+mats+'</div>' : '')+
        '<div class="subj-actions"><button class="btn ghost" data-action="edit-subject" data-id="'+s.id+'">편집</button>'+
          '<button class="btn ghost" data-action="del-subject" data-id="'+s.id+'">삭제</button></div>'+
        '</div>';
    });
    host.innerHTML = html;
  }

  function renderAssignments(tKey, subs, asns, ids){
    var host = $("assignments");
    var open = ids.filter(function(id){ return !asns[id].done; }).length;
    $("asnCount").textContent = ids.length ? open+" / "+ids.length : "";
    if (!ids.length){ host.innerHTML = '<div class="panel-empty">등록된 과제가 없어요.</div>'; return; }
    var arr = ids.map(function(id){return asns[id];}).sort(function(a,b){
      if (a.done!==b.done) return a.done?1:-1;
      if (!a.due) return 1; if(!b.due) return -1; return a.due<b.due?-1:1;
    });
    var html = "";
    arr.forEach(function(a){
      var s = a.subjectId && subs[a.subjectId];
      var tag = s ? '<span class="tag"><span class="dot" style="background:'+subjColor(s)+'"></span>'+esc(s.name)+'</span>' : '';
      var dm = "";
      if (a.due){
        var n = diffDays(tKey, a.due);
        var cls = (!a.done && n<0)?"over":(!a.done && n<=1)?"soon":"";
        dm = '<span class="dm '+cls+'">'+fmtDate(a.due)+' · '+(n<0?"지남":ddayLabel(n))+'</span>';
      }
      html += '<div class="asn '+(a.done?"done":"")+'">'+
        '<button class="check" data-action="toggle-asn" data-id="'+a.id+'" aria-label="완료 전환">'+CHECK+'</button>'+
        '<div class="info"><div class="t">'+esc(a.title)+'</div><div class="m">'+tag+dm+'</div></div>'+
        '<button class="del" data-action="del-asn" data-id="'+a.id+'" aria-label="삭제">'+X+'</button>'+
        '</div>';
    });
    host.innerHTML = html;
  }

  /* ============ 데모 상태에서 실행하려 하면 유도 ============ */
  function guardDemo(){
    if (isDemo){ openSubjectModal(null); return true; }
    return false;
  }

  /* ============ 이벤트 위임 ============ */
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-action]");
    if (!t) return;
    var act = t.getAttribute("data-action");
    var id = t.getAttribute("data-id");
    if (act==="add-subject") return openSubjectModal(null);
    if (act==="add-assignment") { if(guardDemo()) return; return openAssignmentModal(null); }
    if (act==="edit-subject") { if(guardDemo()) return; return openSubjectModal(subjects()[id]); }
    if (act==="del-subject") { if(guardDemo()) return; if(confirm("이 과목을 삭제할까요?")) store.deleteSubject(id); return; }
    if (act==="del-asn") { if(guardDemo()) return; store.deleteAssignment(id); return; }
    if (act==="toggle-asn") { if(guardDemo()) return; var a=Object.assign({},assignments()[id]); a.done=!a.done; store.saveAssignment(a); return; }
    if (act==="toggle-study") {
      if(guardDemo()) return;
      var s=Object.assign({},subjects()[id]); s.done=Object.assign({},s.done); var k=todayKey();
      if(s.done[k]) delete s.done[k]; else s.done[k]=true; store.saveSubject(s); return;
    }
  });

  /* ============ 모달 ============ */
  var scrim = $("scrim"), modal = $("modal");
  function closeModal(){ scrim.classList.remove("open"); modal.innerHTML=""; }
  scrim.addEventListener("click", function(e){ if(e.target===scrim) closeModal(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeModal(); });

  function openSubjectModal(s){
    var edit = !!s;
    s = s || { name:"", exam:"", workload:2, colorIdx: pickColorIdx(), materials:[], done:{} };
    var mats = (s.materials && s.materials.length) ? s.materials.slice() : [{label:"",url:""}];
    modal.innerHTML =
      '<div class="modal-head"><h3>'+(edit?"과목 편집":"과목 추가")+'</h3><button class="btn icon ghost" data-close>'+X+'</button></div>'+
      '<div class="modal-body">'+
        '<div class="field"><label>과목 이름</label><input id="f-name" placeholder="예: 자료구조" value="'+esc(s.name)+'"></div>'+
        '<div class="row2">'+
          '<div class="field"><label>시험 날짜</label><input id="f-exam" type="date" value="'+esc(s.exam)+'"></div>'+
          '<div class="field"><label>공부 강도</label><select id="f-load">'+
            [1,2,3].map(function(w){ return '<option value="'+w+'" '+(s.workload==w?"selected":"")+'>'+WORKLOAD[w].label+'</option>'; }).join("")+
          '</select></div>'+
        '</div>'+
        '<div class="field"><label>자료 (강의노트·링크 등)</label><div id="f-mats"></div>'+
          '<button class="add-mat" id="addMat">+ 자료 추가</button></div>'+
      '</div>'+
      '<div class="modal-foot"><button class="btn ghost" data-close>취소</button><button class="btn primary" id="saveSubj">'+(edit?"저장":"추가")+'</button></div>';

    var matsHost = $("f-mats");
    function drawMats(){
      matsHost.innerHTML = "";
      mats.forEach(function(m, i){
        var row = el('<div class="mat-edit"><input placeholder="이름" value="'+esc(m.label)+'"><input placeholder="https:// 링크 (선택)" value="'+esc(m.url)+'"><button class="rm" title="삭제">'+X+'</button></div>');
        var ins = row.querySelectorAll("input");
        ins[0].addEventListener("input", function(){ mats[i].label=this.value; });
        ins[1].addEventListener("input", function(){ mats[i].url=this.value; });
        row.querySelector(".rm").addEventListener("click", function(){ mats.splice(i,1); if(!mats.length) mats.push({label:"",url:""}); drawMats(); });
        matsHost.appendChild(row);
      });
    }
    drawMats();
    $("addMat").addEventListener("click", function(){ mats.push({label:"",url:""}); drawMats(); });

    modal.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", closeModal); });
    $("saveSubj").addEventListener("click", function(){
      var name=$("f-name").value.trim(), exam=$("f-exam").value;
      if(!name){ $("f-name").focus(); return; }
      if(!exam){ $("f-exam").focus(); return; }
      var clean = mats.filter(function(m){ return (m.label||"").trim() || (m.url||"").trim(); })
                      .map(function(m){ return {label:(m.label||"").trim()||m.url, url:(m.url||"").trim()}; });
      var obj = { id:s.id, name:name, exam:exam, workload:+$("f-load").value, colorIdx:s.colorIdx||0, materials:clean, done:s.done||{} };
      store.saveSubject(obj).then(closeModal);
    });
    openScrim("f-name");
  }

  function openAssignmentModal(a){
    var edit = !!a;
    a = a || { title:"", subjectId:"", due:"", done:false };
    var subs = subjects();
    var opts = '<option value="">과목 없음</option>' + Object.keys(subs).map(function(id){
      return '<option value="'+id+'" '+(a.subjectId===id?"selected":"")+'>'+esc(subs[id].name)+'</option>';
    }).join("");
    modal.innerHTML =
      '<div class="modal-head"><h3>'+(edit?"과제 편집":"과제 추가")+'</h3><button class="btn icon ghost" data-close>'+X+'</button></div>'+
      '<div class="modal-body">'+
        '<div class="field"><label>과제 내용</label><input id="a-title" placeholder="예: 리포트 3장 제출" value="'+esc(a.title)+'"></div>'+
        '<div class="row2">'+
          '<div class="field"><label>연결 과목</label><select id="a-subj">'+opts+'</select></div>'+
          '<div class="field"><label>마감일</label><input id="a-due" type="date" value="'+esc(a.due)+'"></div>'+
        '</div>'+
      '</div>'+
      '<div class="modal-foot"><button class="btn ghost" data-close>취소</button><button class="btn primary" id="saveAsn">'+(edit?"저장":"추가")+'</button></div>';
    modal.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", closeModal); });
    $("saveAsn").addEventListener("click", function(){
      var title=$("a-title").value.trim();
      if(!title){ $("a-title").focus(); return; }
      var obj = { id:a.id, title:title, subjectId:$("a-subj").value, due:$("a-due").value, done:a.done||false };
      store.saveAssignment(obj).then(closeModal);
    });
    openScrim("a-title");
  }

  function openScrim(focusId){
    scrim.classList.add("open");
    var f = $(focusId); if(f) setTimeout(function(){ f.focus(); }, 30);
  }
  function pickColorIdx(){
    var subs = subjects();
    return Object.keys(subs).length % PALETTE.length;
  }

  /* ============ 테마 토글 ============ */
  var themeBtn = $("themeBtn");
  try { var saved = localStorage.getItem("exam_theme"); if(saved) document.documentElement.setAttribute("data-theme", saved); } catch(e){}
  themeBtn.addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    var isDark = cur ? cur==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("exam_theme", next); } catch(e){}
  });

  /* ============ 부팅 ============ */
  function boot(realStore){
    store = realStore;
    isDemo = false;
    store.start(function(){
      // 실데이터가 비어 있으면 데모 표시
      var empty = !Object.keys(store.getSubjects()).length && !Object.keys(store.getAssignments()).length;
      if (empty){ isDemo = true; _demo = _demo || demoData(); }
      else { isDemo = false; }
      render();
    });
  }

  // 먼저 로컬 스토어로 즉시 렌더(빠른 첫 화면), db 연결되면 승격
  var local = new LocalStore();
  // 로컬에 데이터가 없으면 데모부터 보여주기 위해 임시 렌더
  (function initialPaint(){
    isDemo = !Object.keys(local.getSubjects()).length && !Object.keys(local.getAssignments()).length;
    if (isDemo) _demo = demoData();
    store = local;
    render();
  })();

  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("db").then(function(db){
      if (db){ boot(new DbStore(db)); }
      else { boot(local); }
    }).catch(function(){ boot(local); });
  } else {
    boot(local);
  }
})();
</script>
